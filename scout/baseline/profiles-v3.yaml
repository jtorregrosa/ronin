# Perfiles modelo/pod para LLMs abliterated/uncensored, v3 (ronda 2 de auditoría aplicada, 2026-10-21).
# Ronda 2: data/verification/round2/*.md. La v2 queda en data/verification/round2/profiles-v2-pre-round2.yaml.
# decision: TIE-VALIDATE = ningún candidato tiene evidencia [IND] en los dos ejes (cumplimiento y capacidad); hay que decidir con un A/B.
# abliterlitics distingue unlocked (% que cumpliría) de delivered (% que además termina la respuesta, sin bucle). Mide con temp 0 y un límite de 15,360 tokens: es el peor caso.
# La auditoría completa está en data/verification/{basic,medium,big,huge}/AUDIT.md y en data/verification/pricing.md.
# La v1 queda en data/verification/profiles-v1-pre-audit.yaml.
#
# Origen de cada dato:
#   [IND] medición independiente del mismo protocolo sobre varios modelos (abliterlitics.dev o satellitedown)
#   [AUT] publicado por quien sube el modelo (verificado que la cifra aparece en su card, no que sea cierta)
#   [NV]  sin medir / no verificable
#
# Precios: RunPod community en USD por hora y pod completo, re-consultados el 2026-10-21.
# Secure cuesta entre +30 % (B300) y +162 % (4090) más que community.
# La RAM mínima del pod (minMemory) varía con cada consulta: al desplegar, filtra por la RAM indicada.
# Todos los modelos son razonadores. Fija reasoning_effort de forma explícita: algunos chat templates traen otro valor por defecto.

tiers:
  basic:  {pod: "1x RTX 4090 24GB", usd_h: 0.34, alt_pod: "1x RTX 5090 32GB (0.69)", ram_gb: ">=32"}
  medium: {pod: "1x L40S 48GB (Ada: FP8 nativo)", usd_h: 0.79, alt_pod: "1x RTX A6000 48GB (0.33): GGUF o INT8 W8A16; el FP8 corre como W8A16 vía Marlin, más lento", ram_gb: ">=64"}
  big:    {pod: "1x RTX PRO 6000 96GB (Blackwell)", usd_h: 1.69, alt_pod: "1x H200 141GB (3.59)", ram_gb: ">=128", disk_gb: ">=200"}
  huge:   {pod: "4x H200 (14.36) | 4x RTX PRO 6000 (6.76) | 8x H100 (21.52)", usd_h: 14.36, ram_gb: ">=500 (DeepSeek mueve la tabla engram de 203 GB a RAM del host)", disk_gb: ">=600 (network volume)"}

